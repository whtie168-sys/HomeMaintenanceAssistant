workflows:
  ios-native-quick-start:
    name: HomeMaintenanceAssistant

    max_build_duration: 120

    instance_type: mac_mini_m2

    integrations:
      app_store_connect: HomeMaintenanceAssistant

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.qxqload.saker

      vars:
        BUNDLE_ID: $bundle_identifier
        PROJECT_PATH: "HomeMaintenanceAssistant"
        XCODE_WORKSPACE: "$PROJECT_PATH/$PROJECT_PATH.xcworkspace"
        XCODE_SCHEME: $PROJECT_PATH
        APP_STORE_APPLE_ID: 6811632368

      xcode: latest
      cocoapods: default

    scripts:

      - name: Install CocoaPods dependencies
        script: |
          cd $PROJECT_PATH
          pod install

      - name: Set up provisioning profiles settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd $PROJECT_PATH

          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")

          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:

      email:
        recipients:
          - 985446278@qq.com
          - user_2@example.com

        notify:
          success: true
          failure: false

      app_store_connect:
        auth: integration

        # 只提交 TestFlight 外部测试审核
        submit_to_testflight: true

        # 不提交 App Store 正式审核
        submit_to_app_store: false
